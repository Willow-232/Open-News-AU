<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Open News AU</title>
<meta name="description" content="Open-source daily news from reputable sources across the spectrum. Australia first, then the world.">
<meta name="theme-color" content="#0f3d3e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="News AU">
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #1b1f1e; --muted: #5d6664; --line: #e4e2db;
    --brand: #0f3d3e; --accent: #d98e04;
    --left: #3b6fb6; --centre: #8a8f8d; --right: #c0473a;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111514; --card: #1a1f1e; --ink: #e9ecea; --muted: #9aa3a0; --line: #2a302f;
            --brand: #7fc4bf; --left: #6f9ee0; --centre: #a3a9a7; --right: #e07a6e; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg);
           padding: calc(env(safe-area-inset-top) + 12px) 16px 0; border-bottom: 1px solid var(--line); }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  h1 { margin: 0; font-size: 22px; letter-spacing: -0.02em; color: var(--brand); }
  h1 span { color: var(--accent); }
  #updated { font-size: 12px; color: var(--muted); }
  nav { display: flex; gap: 4px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
  nav button { flex: 0 0 auto; border: 0; background: none; color: var(--muted); font: inherit; font-size: 15px; font-weight: 600;
               padding: 8px 9px 10px; border-bottom: 3px solid transparent; cursor: pointer; }
  nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .filters { display: flex; gap: 6px; padding: 10px 0; overflow-x: auto; scrollbar-width: none; }
  .chip { flex: 0 0 auto; border: 1px solid var(--line); background: var(--card); color: var(--ink);
          border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--brand); color: var(--bg); border-color: var(--brand); }
  main { max-width: 720px; margin: 0 auto; padding: 12px 12px calc(env(safe-area-inset-bottom) + 40px); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
          padding: 14px 16px; margin-bottom: 12px; }
  .card h2 { font-size: 17px; line-height: 1.3; margin: 0 0 6px; }
  .card h2 a { color: inherit; text-decoration: none; }
  .card p { margin: 0 0 10px; color: var(--muted); font-size: 14px; }
  .meta { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .bar { display: flex; height: 6px; width: 90px; border-radius: 3px; overflow: hidden; background: var(--line); }
  .bar i { display: block; height: 100%; }
  .bar .l { background: var(--left); } .bar .c { background: var(--centre); } .bar .r { background: var(--right); }
  .blind { color: var(--accent); font-weight: 600; }
  details { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
  summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--brand); list-style: none; }
  summary::-webkit-details-marker { display: none; }
  .story { display: block; padding: 8px 0; text-decoration: none; color: var(--ink); border-bottom: 1px dashed var(--line); }
  .story:last-child { border-bottom: 0; }
  .story b { font-size: 12px; font-weight: 600; }
  .story div { font-size: 14px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
  .dot.left { background: var(--left); } .dot.centre { background: var(--centre); } .dot.right { background: var(--right); }
  .empty { text-align: center; color: var(--muted); padding: 40px 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { text-align: left; padding: 8px 4px; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  .ok { color: #2e8b57; } .err { color: var(--right); }
  .legend { font-size: 12px; color: var(--muted); margin: 4px 0 14px; }
  footer { text-align: center; font-size: 12px; color: var(--muted); padding: 10px; }
  footer a { color: inherit; }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Open News <span>AU</span></h1>
    <div id="updated">Loading…</div>
  </div>
  <nav role="tablist">
    <button role="tab" data-tab="australia" aria-selected="true">Australia</button>
    <button role="tab" data-tab="world" aria-selected="false">World</button>
    <button role="tab" data-tab="factcheck" aria-selected="false">Fact checks</button>
    <button role="tab" data-tab="sources" aria-selected="false">Sources</button>
  </nav>
  <div class="filters" id="filters">
    <button class="chip" data-f="all" aria-pressed="true">All stories</button>
    <button class="chip" data-f="multi" aria-pressed="false">Covered by 2+ outlets</button>
    <button class="chip" data-f="blind" aria-pressed="false">One-sided coverage</button>
  </div>
</header>

<main id="main"><div class="empty">Loading the news…</div></main>

<footer>
  Headlines link to the original publishers. Lean and reliability labels are estimates — see the Sources tab.<br>
  <a href="https://github.com/" id="repo">Open source on GitHub</a>
</footer>

<script>
(function () {
  const BUCKET = { "left": "left", "left-centre": "left", "centre": "centre", "right-centre": "right", "right": "right" };
  const LABEL = { "left": "Left", "left-centre": "Left-centre", "centre": "Centre", "right-centre": "Right-centre", "right": "Right" };
  const REL = { "very-high": "Very high", "high": "High", "mostly-factual": "Mostly factual", "mixed": "Mixed" };
  let data = null, tab = "australia", filter = "all";
  try { tab = localStorage.getItem("tab") || tab; } catch (e) {}

  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const safeUrl = (u) => /^https?:\/\//i.test(u || "") ? u : "#";

  function ago(iso) {
    const mins = Math.round((Date.now() - new Date(iso)) / 60000);
    if (mins < 60) return Math.max(mins, 1) + "m ago";
    const h = Math.round(mins / 60);
    return h < 48 ? h + "h ago" : Math.round(h / 24) + "d ago";
  }

  function isOneSided(c) {
    if (c.source_count < 3) return false;
    const { left, centre, right } = c.leans;
    return (left === 0 || right === 0) && left + right >= 2 && centre <= 1;
  }

  function bar(leans) {
    const t = leans.left + leans.centre + leans.right || 1;
    const w = (n) => (n / t * 100).toFixed(0) + "%";
    return `<span class="bar" title="Left ${leans.left} · Centre ${leans.centre} · Right ${leans.right}">
      <i class="l" style="width:${w(leans.left)}"></i><i class="c" style="width:${w(leans.centre)}"></i><i class="r" style="width:${w(leans.right)}"></i></span>`;
  }

  function card(c) {
    const lead = c.stories[0];
    const more = c.stories.length > 1;
    const blind = isOneSided(c) ? `<span class="blind">${c.leans.left ? "Mostly left-leaning coverage" : "Mostly right-leaning coverage"}</span>` : "";
    const list = c.stories.map((s) => `
      <a class="story" href="${esc(safeUrl(s.link))}" target="_blank" rel="noopener">
        <b><span class="dot ${BUCKET[s.lean] || "centre"}"></span>${esc(s.source)} · ${ago(s.published)}</b>
        <div>${esc(s.title)}</div>
      </a>`).join("");
    return `<article class="card">
      <h2><a href="${esc(safeUrl(lead.link))}" target="_blank" rel="noopener">${esc(c.headline)}</a></h2>
      ${c.summary ? `<p>${esc(c.summary)}</p>` : ""}
      <div class="meta">
        ${bar(c.leans)}
        <span>${more ? c.source_count + " outlets" : esc(lead.source)}</span>
        <span>${ago(c.latest)}</span>
        ${blind}
      </div>
      ${more ? `<details><summary>Compare ${c.source_count} outlets ▾</summary>${list}</details>` : ""}
    </article>`;
  }

  function sourcesView() {
    const order = { australia: 0, world: 1, factcheck: 2 };
    const rows = data.sources.slice().sort((a, b) => order[a.region] - order[b.region]).map((s) => `
      <tr><td><span class="dot ${BUCKET[s.lean] || "centre"}"></span>${esc(s.name)}</td>
      <td>${LABEL[s.lean] || s.lean}</td><td>${REL[s.reliability] || s.reliability}</td>
      <td class="${s.ok ? "ok" : "err"}" title="${esc(s.error || "")}">${s.ok ? s.count : "failed"}</td></tr>`).join("");
    return `<div class="card">
      <p class="legend">The coloured bar on each story shows which way the outlets covering it lean:
        <span class="dot left"></span>left <span class="dot centre"></span>centre <span class="dot right"></span>right.
        Labels are starting estimates from Media Bias/Fact Check and Ad Fontes Media — edit <code>sources.json</code> to change them.</p>
      <table><thead><tr><th>Outlet</th><th>Lean</th><th>Reliability</th><th>Today</th></tr></thead><tbody>${rows}</tbody></table>
    </div>`;
  }

  function render() {
    document.querySelectorAll("nav button").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === tab));
    document.querySelectorAll(".chip").forEach((b) => b.setAttribute("aria-pressed", b.dataset.f === filter));
    $("#filters").style.display = tab === "sources" || tab === "factcheck" ? "none" : "flex";
    if (!data) return;
    if (tab === "sources") { $("#main").innerHTML = sourcesView(); return; }
    let list = (data.regions && data.regions[tab]) || [];
    if (filter === "multi") list = list.filter((c) => c.source_count >= 2);
    if (filter === "blind") list = list.filter(isOneSided);
    $("#main").innerHTML = list.length ? list.map(card).join("")
      : `<div class="empty">${data.generated ? "Nothing here right now." : "The first daily update hasn't run yet. Check back after it runs (see the README)."}</div>`;
  }

  document.querySelector("nav").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    tab = b.dataset.tab; try { localStorage.setItem("tab", tab); } catch (err) {}
    render(); window.scrollTo(0, 0);
  });
  $("#filters").addEventListener("click", (e) => {
    const b = e.target.closest(".chip"); if (!b) return;
    filter = b.dataset.f; render();
  });

  fetch("news.json?t=" + Date.now(), { cache: "no-store" })
    .then((r) => r.json())
    .then((d) => {
      data = d;
      $("#updated").textContent = d.generated
        ? "Updated " + new Date(d.generated).toLocaleString("en-AU", { weekday: "short", hour: "numeric", minute: "2-digit", day: "numeric", month: "short" })
        : "Not updated yet";
      render();
    })
    .catch(() => { $("#main").innerHTML = '<div class="empty">Couldn\'t load the news. Check your connection and refresh.</div>'; $("#updated").textContent = ""; });

  // Point the footer link at this repo when hosted on GitHub Pages (user.github.io/repo).
  const m = location.hostname.match(/^([^.]+)\.github\.io$/);
  if (m) { const repo = location.pathname.split("/")[1]; $("#repo").href = `https://github.com/${m[1]}/${repo || ""}`; }

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  render();
})();
</script>
</body>
</html>
