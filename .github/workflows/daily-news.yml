name: Daily news update

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch: {}
  push:
    paths: ["sources.json", "scripts/**"]

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch feeds and build news.json
        run: python scripts/fetch_news.py
      - name: Commit the new news
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add docs/news.json
          git diff --cached --quiet || git commit -m "Daily news update $(date -u +%Y-%m-%d)"
          git push
