name: News update

on:
  schedule:
    # Every hour, at 17 minutes past (GitHub is busiest on the hour, which delays runs).
    # For every 2 hours use "17 */2 * * *"; for every 30 minutes use "17,47 * * * *".
    - cron: "17 * * * *"
  workflow_dispatch: {}
  push:
    paths: ["sources.json", "scripts/**"]

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch feeds and build news.json
        run: python scripts/fetch_news.py
      - name: Commit the new news
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add docs/news.json
          git diff --cached --quiet || git commit -m "News update $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --quiet
          git push
